<html lang="en">
<head>
    <meta charset="UTF-8">

</head>

<body>

<a class="skip-link" href="#main-content">Skip to main content</a>

<header>
    <nav class="navbar" aria-label="Main navigation">
        <a href="index.html" class="logo">Health <span>&</span> Fitness</a>

        <button class="nav-toggle" type="button"
                aria-label="Open navigation menu"
                aria-expanded="false">☰</button>

        <ul class="nav-menu">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="exercise.html">Exercise</a></li>

            <li><a href="goals.html">Goals</a></li>
            <li><a href="resources.html">Resources</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
</header>

<main id="main-content">

    <section class="page-banner">
        <div class="container">
            <h1>Contact</h1>
            <p>Send feedback about the website.</p>
        </div>
    </section>

    <section class="section">
        <div class="container">

            <div class="form-container">

                <form id="contact-form" novalidate>

                    <div class="form-group">
                        <label for="contact-name">Name</label>
                        <input type="text"
                               id="contact-name"
                               maxlength="60"
                               required>
                        <small id="name-error" class="error"></small>
                    </div>

                    <div class="form-group">
                        <label for="contact-email">Email</label>
                        <input type="email"
                               id="contact-email"
                               maxlength="100"
                               required>
                        <small id="email-error" class="error"></small>
                    </div>

                    <div class="form-group">
                        <label for="contact-message">Message</label>
                        <textarea id="contact-message"
                                  rows="6"
                                  maxlength="500"
                                  required></textarea>
                        <small id="message-error" class="error"></small>
                    </div>

                    <button type="submit" class="btn">
                        Submit Feedback
                    </button>

                    <div id="contact-success"></div>

                </form>

            </div>

        </div>
    </section>

</main>

<footer>
    <div class="footer-content">
        <p><strong>Health & Fitness Tracker</strong></p>
        <p>&copy; <span id="current-year"></span> Health & Fitness Tracker</p>
    </div>
</footer>

<script src="js/main.js"></script>
<script src="js/contact.js"></script>
</body>
</html>
